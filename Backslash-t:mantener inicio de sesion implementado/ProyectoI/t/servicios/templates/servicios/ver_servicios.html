{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="with=device-width, initial-scale=1.0">
        <title>Publicaciones</title>
        <link rel="stylesheet" href="{% static 'servicios/ver_servicios.css' %}">
    </head>

    <body>
        <header class="barra-superior">
            <a href="{% url 'registro_login:index' %}" class="volver">Volver</a>
            <img src="logo.png" class="logo"/>
        </header>

        <main class="principal">
            <aside class="barra-derecha">
                <div class="busqueda">
                    <input type="text" placeholder="Buscar publicación...">
                    <button>🔍</button>
                </div>

                <div class="filtros">
                    <h3>¿Cómo usar?</h3>
                    <div class="opcion">
                        ¡Es bastante simple! Solo tienes que presionar sobre las 
                        publicaciones y te mostrará más información al respecto.
                    </div>
                </div>
            </aside>

            <section class="scroll">
                <div class="publicaciones">
                    {% for s in servicios %}
                    <a href="" class="publicacion">
                        <img src="jardinero.jpg" alt="Foto de perfil" class="foto">
                        <div class="info">
                            <h2 class="trabajo">{{s.titulo}}</h2>
                            <p class="datos">{{s.trabajador}} | {{s.localidad}}</p>
                            <p class="tarifa">💼 ${{s.precio}} / hora</p>
                        </div>
                        <!---<div class="fecha">
                            <p>Publicado: 02/11/2025</p>
                        </div>--->           
                            
                        
                    </a>
                    {% endfor %}  
                </div>
            </section>
        </main>
    </body>
</html>
