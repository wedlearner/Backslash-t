{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inicio</title>
    <style>
        *{
        padding: 0;
        margin: 0;
        }

        body{
            background: linear-gradient(to bottom, #d7b896, #f0d8b4);
            height: 100vh;
        }

        .barra-superior{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-image: linear-gradient(rgba(255, 223, 179, 0.7), rgb(69, 33, 0, 0.7)), url("{% static 'registro_login/jardinero.jpg' %}");
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .volver{
            position: absolute;
            left: 0;
            text-decoration: none;
            background-color: #452100;
            color: #ffdfb3;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 35px;
            transition: background-color 0.3s;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
        }

        .logo{
            height: 40px;
        }

        .header{
            min-height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
            display: block;
            
        }

        nav{
            display: flex;
            padding: 2% 6%;
            justify-content: space-between;
            align-items: center;
        }

        .text-box{
            width: 90%;
            position: absolute;
            left: 50%;
            margin-bottom: 0px;
            transform: translate(-50%,-190%);
            text-align: center;
            color: #2f1700;
            font-size: 23px;
        }

        .button{
            display: flex;
            justify-content: center;
            margin-top: 15rem;
        }

        .cta{
            display:inline-flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .btn{
            display: inline-flex;       /* permite centrar contenido */
            flex-direction: column;
            align-items: center;        /* centra horizontalmente */
            justify-content: center;    /* centra verticalmente */
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.18);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            min-width: 30%;
            height: 430px;
            text-align: center;
            margin: 1rem;
            background-color: #452100;
            color: #ffdfb3;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.5);
            font-size: 25px;
            text-decoration: none;
        }

        .btn_text{
            height: auto;
            display: block;
        }

        .btn:hover,
        .btn:focus{
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            outline: none;
            background-color: #2f1700;
        }
    </style>
</head>
<body>
    <header class="barra-superior">
        <a href="{% url 'registro_login:index' %}" class="volver">Volver</a>
        <img src="{% static 'registro_login/logo.png' %}" class="logo"/>
    </header>
    
    <section class="header">

        
        <div class="text-box">
            <h1>Que quieres hacer en [\t]?</h1>
        </div>

        <div class="button">
            <div class="cta">
                <a href="{% url 'perfiles:tutorial' %}" class="btn primary"><p class="btn_text">Ofrecer servicio</p></a>
                <a href="{% url 'servicios:ver_servicios' %}" class="btn secondary"><p class="btn_text">Buscar servicio</p></a>
            </div>
        </div>


    </section>
    
</body>
</html>
